# Checks, tests and packs the extension. Run by hand on main it builds main, and when the
# version has no tag yet it also releases it: a GitHub Release with the vsix attached, which
# `rant install vscode` downloads.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Whether this run releases: on main, when no tag v<version> exists yet
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        run: |
          v="$(node -p "require('./package.json').version")"
          found=0
          git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null || found=$?
          # 2 is no such tag, anything else a lookup that went wrong
          test "$found" = 0 || test "$found" = 2
          release=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$found" = 2 ]; then release=true; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # the tests open a Rant node on loopback, which needs multicast there
      - name: Loopback multicast
        run: sudo ip link set lo multicast on

      - name: Check, test and pack
        timeout-minutes: 10
        run: |
          npm ci
          npm test
          npm run package
          mkdir -p out
          mv vscode-rant-*.vsix "out/rant-vscode-$(node -p "require('./package.json').version").vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: rant-vscode
          path: out/*

  # The release makes the tag v<version> on this commit, once the checks above passed
  release:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # a later commit's run that passed too finds the version taken and stops
      - name: The version is not released from another commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          at="$(gh api "repos/$GITHUB_REPOSITORY/commits/v${{ needs.plan.outputs.version }}" --jq .sha 2>/dev/null || true)"
          test -z "$at" || test "$at" = "$GITHUB_SHA"

      - uses: actions/download-artifact@v8
        with:
          name: rant-vscode
          path: out

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
